<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Soft glowing vertical connection tracks -->
    <linearGradient id="col1Track" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4285F4" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#34A853" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#4285F4" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="col2Track" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4285F4" stop-opacity="0.5" />
      <stop offset="33%" stop-color="#FBBC04" stop-opacity="0.5" />
      <stop offset="66%" stop-color="#EA4335" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#34A853" stop-opacity="0.5" />
    </linearGradient>
    <linearGradient id="col3Track" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34A853" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#FBBC04" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#EA4335" stop-opacity="0.4" />
    </linearGradient>

    <!-- Node Gradients with Specular Highlight -->
    <radialGradient id="dotBlue" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#8AB4F8" />
      <stop offset="60%" stop-color="#4285F4" />
      <stop offset="100%" stop-color="#1A73E8" />
    </radialGradient>
    <radialGradient id="dotGreen" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#81C995" />
      <stop offset="60%" stop-color="#34A853" />
      <stop offset="100%" stop-color="#1E8E3E" />
    </radialGradient>
    <radialGradient id="dotYellow" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FDE293" />
      <stop offset="60%" stop-color="#FBBC04" />
      <stop offset="100%" stop-color="#F29900" />
    </radialGradient>
    <radialGradient id="dotRed" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#F28B82" />
      <stop offset="60%" stop-color="#EA4335" />
      <stop offset="100%" stop-color="#D93025" />
    </radialGradient>

    <filter id="nodeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="rgba(0,0,0,0.5)" />
    </filter>
  </defs>

  <!-- Vertical Connecting Bus Tracks -->
  <line x1="13" y1="12" x2="13" y2="34" stroke="url(#col1Track)" stroke-width="2.5" stroke-linecap="round" />
  <line x1="24" y1="7" x2="24" y2="41" stroke="url(#col2Track)" stroke-width="3" stroke-linecap="round" />
  <line x1="35" y1="13" x2="35" y2="35" stroke="url(#col3Track)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Column 1 (Left): 3 Nodes -->
  <g filter="url(#nodeGlow)">
    <circle cx="13" cy="12" r="4.2" fill="url(#dotBlue)" />
    <circle cx="13" cy="23" r="4.2" fill="url(#dotGreen)" />
    <circle cx="13" cy="34" r="4.2" fill="url(#dotBlue)" />
  </g>

  <!-- Column 2 (Center): 4 Nodes (Hero Column) -->
  <g filter="url(#nodeGlow)">
    <circle cx="24" cy="7" r="4.8" fill="url(#dotBlue)" />
    <circle cx="24" cy="18" r="4.8" fill="url(#dotYellow)" />
    <circle cx="24" cy="29" r="4.8" fill="url(#dotRed)" />
    <circle cx="24" cy="40" r="4.8" fill="url(#dotGreen)" />
  </g>

  <!-- Column 3 (Right): 3 Nodes -->
  <g filter="url(#nodeGlow)">
    <circle cx="35" cy="13" r="4.2" fill="url(#dotGreen)" />
    <circle cx="35" cy="24" r="4.2" fill="url(#dotYellow)" />
    <circle cx="35" cy="35" r="4.2" fill="url(#dotRed)" />
  </g>
</svg>